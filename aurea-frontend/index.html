<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (fallback — per-route overrides via react-helmet-async) -->
    <meta name="description" content="Aurea — Science-backed skincare for Indian skin. Shop serums, moisturisers, sunscreens, and more. Dermatologist tested formulas." />
    <title>Aurea — Skincare Redefined</title>

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="apple-mobile-web-app-title" content="Aurea" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurea" />
    <meta property="og:title" content="Aurea — Skincare Redefined" />
    <meta property="og:description" content="Science-backed skincare for Indian skin. Shop serums, moisturisers, sunscreens, and more." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurea — Skincare Redefined" />
    <meta name="twitter:description" content="Science-backed skincare for Indian skin. Dermatologist tested formulas." />

    <!-- Performance: Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!--
      Cloudinary Upload Widget — loaded with 'defer' to prevent render-blocking.
      Only used by admin pages (AdminProducts, AdminSettings).
      Consider lazy-loading this only on admin routes for further optimization.
    -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
